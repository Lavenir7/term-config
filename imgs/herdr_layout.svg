<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <!-- 文字发光/阴影效果 -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.8"/>
    </filter>
    <filter id="boxShadow" x="-5%" y="-10%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    
    <style>
      .bg { fill: #0a0a0a; }
      .workspace-box { fill: #141414; stroke: #ff0000; stroke-width: 4; rx: 16; }
      .sub-box { fill: #1a1a1a; stroke: #ff0000; stroke-width: 3; rx: 10; }
      .pane-box { fill: #1e1e1e; stroke: #ff0000; stroke-width: 3; rx: 8; }
      .sidebar-item { fill: #1e1e1e; stroke: #ff0000; stroke-width: 3; rx: 6; }
      .tab-item { fill: #1e1e1e; stroke: #ff0000; stroke-width: 3; rx: 6; }
      
      .text-title { font-family: 'Segoe UI', Arial, sans-serif; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; font-size: 18px; }
      .text-label { font-family: 'Segoe UI', Arial, sans-serif; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; font-size: 14px; }
      .text-pane { font-family: 'Segoe UI', Arial, sans-serif; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; font-size: 20px; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="420" class="bg" />

  <!-- ================= Workspace 外框 ================= -->
  <!-- 外框上移，减小与内部元素的间距 -->
  <rect x="20" y="45" width="560" height="355" class="workspace-box" filter="url(#boxShadow)" />
  <text x="300" y="25" class="text-title" filter="url(#textShadow)">Workspace</text>

  <!-- ================= 左侧边栏 (Sidebar) ================= -->
  <rect x="35" y="65" width="110" height="320" class="sub-box" />
  
  <!-- machines -->
  <rect x="45" y="78" width="90" height="140" class="sidebar-item" />
  <text x="90" y="148" class="text-label" filter="url(#textShadow)">machines</text>
  
  <!-- agents -->
  <rect x="45" y="232" width="90" height="140" class="sidebar-item" />
  <text x="90" y="302" class="text-label" filter="url(#textShadow)">agents</text>

  <!-- ================= 右侧主区域 (Main Area) ================= -->
  <!-- Tab 栏外框 -->
  <rect x="160" y="65" width="400" height="50" class="sub-box" />
  
  <!-- Tab 1, 2, 3 -->
  <rect x="170" y="73" width="65" height="34" class="tab-item" />
  <text x="202" y="91" class="text-label" filter="url(#textShadow)">Tab 1</text>
  
  <rect x="245" y="73" width="65" height="34" class="tab-item" />
  <text x="277" y="91" class="text-label" filter="url(#textShadow)">Tab 2</text>
  
  <rect x="320" y="73" width="65" height="34" class="tab-item" />
  <text x="352" y="91" class="text-label" filter="url(#textShadow)">Tab 3</text>

  <!-- Pane 区域外框 -->
  <rect x="160" y="130" width="400" height="255" class="sub-box" />

  <!-- Pane 1 (左侧大 Pane) -->
  <rect x="175" y="145" width="230" height="225" class="pane-box" />
  <text x="290" y="257" class="text-pane" filter="url(#textShadow)">Pane 1</text>

  <!-- Pane 2 (右上角) -->
  <rect x="420" y="145" width="125" height="102" class="pane-box" />
  <text x="482" y="196" class="text-pane" filter="url(#textShadow)">Pane 2</text>

  <!-- Pane 3 (右下角) -->
  <rect x="420" y="262" width="125" height="108" class="pane-box" />
  <text x="482" y="316" class="text-pane" filter="url(#textShadow)">Pane 3</text>

</svg>