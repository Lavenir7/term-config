# Complete / Chat / Edit
# prompt
[trans2cn]
options.token_file_path = ~/.vim/ai/tokens/your.token
options.endpoint_url = https://example.com/v1/chat/completions
options.model = deepseek-flash
prompt = Translate this passage into Chinese
options.temperature = 0.2

[trans2en]
options.token_file_path = ~/.vim/ai/tokens/your.token
options.endpoint_url = https://example.com/v1/chat/completions
options.model = deepseek-flash
prompt = Translate this passage into English
options.temperature = 0.2

[cc]
prompt = Please continue the rest of the code based on the existing code.
options.temperature = 0.1

